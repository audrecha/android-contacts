name: Emulator checklist
on:
  push:
    branches: [generics-refactoring]
    paths:
      - 'app/**'
      - '.github/workflows/emulator.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APK
        run: bash gradlew assembleDebug assembleDebugAndroidTest
      - name: Run checklist on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: |
            bash gradlew connectedDebugAndroidTest; result=$?; adb pull /sdcard/Android/data/ru.yandex.practicum.contacts/files/checklist emulator-screenshots; exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-checklist
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-screenshots/
